<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- otracita monogram: warm terracotta disc with an italic serif "o"
       echoing the Fraunces wordmark. The stylized "o" reads as both the
       first letter of the brand and an open mouth that speaks. -->
  <circle cx="24" cy="24" r="22" fill="#C9653C"/>
  <g transform="translate(24 24) rotate(-10)">
    <path d="M -10 0
             C -10 -5.4, -5.4 -8.4, 0 -8.4
             C 5.4 -8.4, 10 -5.4, 10 0
             C 10 5.4, 5.4 8.4, 0 8.4
             C -5.4 8.4, -10 5.4, -10 0 Z
             M -6.2 0
             C -6.2 3.4, -3.4 5.2, 0 5.2
             C 3.4 5.2, 6.2 3.4, 6.2 0
             C 6.2 -3.4, 3.4 -5.2, 0 -5.2
             C -3.4 -5.2, -6.2 -3.4, -6.2 0 Z"
          fill="#F7F3EE"
          fill-rule="evenodd"/>
  </g>
</svg>
